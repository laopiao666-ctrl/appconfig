<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#080808">
  <meta name="referrer" content="no-referrer">
  <title>91视频</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080808;color:#eee;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
    main{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center}
    h1{font-size:23px;margin:0 0 20px}p{font-size:15px;line-height:1.7;margin:0 0 24px}button,a{font:inherit;color:#fff;border:1px solid #555;border-radius:10px;background:#252525;padding:12px 22px;text-decoration:none;margin:6px} [hidden]{display:none!important}
  </style>
</head>
<body>
  <main>
    <h1 id="title">91视频</h1>
    <p id="status" role="status" aria-live="polite">正在连接，请稍候…</p>
    <a id="enter" hidden rel="noreferrer">点击进入</a>
    <button id="retry" type="button" hidden>重新连接</button>
    <noscript>请开启 JavaScript 后重新打开。</noscript>
  </main>
  <script>
  'use strict';
  const SOURCES = [
    'https://gitee.com/laopiao666-ctrl/appconfig/raw/master/laopiao666-ctrl',
    'https://raw.githubusercontent.com/laopiao666-ctrl/appconfig/main/laopiao666-ctrl'
  ];
  const TIMEOUT_MS = 5000;
  const statusNode = document.getElementById('status');
  const retryNode = document.getElementById('retry');
  const enterNode = document.getElementById('enter');
  const shortVersion = new URLSearchParams(location.search).get('page') === '2';
  if (shortVersion) document.getElementById('title').textContent = document.title = '免费短剧';
  let running = false;

  function parseConfig(text) {
    // One complete line only; do not execute content from configuration files.
    const match = String(text).replace(/^\uFEFF/, '').trim().match(/^pspm:(\d{1,3}(?:\.\d{1,3}){3}):(\d{1,5})$/);
    if (!match) throw new Error('Invalid configuration');
    const octets = match[1].split('.');
    if (octets.some(n => Number(n) > 255 || (n.length > 1 && n[0] === '0'))) throw new Error('Invalid IPv4');
    const port = Number(match[2]) + 1;
    if (port < 1 || port > 65535) throw new Error('Invalid port');
    return 'http://' + match[1] + ':' + port + '/?client=ios_webclip' + (shortVersion ? '&page=2' : '');
  }

  async function readSource(source) {
    const controller = new AbortController();
    let timer;
    // Deadline includes connection, redirects and reading the response body.
    const deadline = new Promise((_, reject) => {
      timer = setTimeout(() => { controller.abort(); reject(new Error('Timeout')); }, TIMEOUT_MS);
    });
    try {
      const request = (async () => {
        const url = new URL(source);
        url.searchParams.set('_launch', String(Date.now()));
        const response = await fetch(url.href, { signal: controller.signal, cache: 'no-store', credentials: 'omit', referrerPolicy: 'no-referrer' });
        if (!response.ok) throw new Error('Source unavailable');
        const text = await response.text();
        if (text.length > 1024) throw new Error('Unexpected response');
        return parseConfig(text);
      })();
      return await Promise.race([request, deadline]);
    } finally { clearTimeout(timer); }
  }

  async function connect() {
    if (running) return;
    running = true;
    retryNode.hidden = true;
    enterNode.hidden = true;
    try {
      for (let i = 0; i < SOURCES.length; i++) {
        statusNode.textContent = i === 0 ? '正在连接，请稍候…' : '切换线路中，请耐心等待';
        try {
          const target = await readSource(SOURCES[i]);
          statusNode.textContent = '连接成功，正在进入…';
          enterNode.href = target;
          enterNode.hidden = false;
          retryNode.hidden = false;
          // Top-level navigation, not an iframe or an HTTP cross-origin fetch.
          location.replace(target);
          return;
        } catch (_) { /* Try the next source; never use a hard-coded IP. */ }
      }
      statusNode.textContent = '暂时无法连接，请检查网络后重试';
      retryNode.hidden = false;
    } finally { running = false; }
  }
  retryNode.addEventListener('click', connect);
  // Re-read configuration when this entry page is restored from page cache.
  window.addEventListener('pageshow', event => { if (event.persisted) connect(); });
  connect();
  </script>
</body>
</html>
